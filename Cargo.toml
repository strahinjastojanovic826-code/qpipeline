[package]
name = "qpipeline"
version = "1.1.0"
edition = "2024"
authors = ["Strale <strahinjastojanovic826@gmail.com>"]
description = "High-performance 4-state (2-bit quat) processing pipeline engine"
readme = "README.md"
license = "AGPL-3.0-only"
repository = "https://github.com/strahinjastojanovic826-code/qpipeline"
keywords = ["quat", "pipeline", "bit-packing", "no-deps", "parallel"]
categories = ["data-structures", "concurrency"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"